<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opportunity Scanner</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2430;--mute:#667085;--line:#e3e7ee;--acc:#2457d6;--acc-ink:#fff;
--good:#0f7b4f;--warn:#b45309;--bad:#b42318;--chip:#eef1f6}
@media (prefers-color-scheme:dark){:root{--bg:#10141a;--card:#181e27;--ink:#e8ecf2;--mute:#97a1b2;--line:#283140;
--acc:#6b93ff;--acc-ink:#0b1020;--good:#47c28f;--warn:#e5a04b;--bad:#f0877d;--chip:#222b38}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0}
.sub{color:var(--mute);font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button,.btn,select,input{font:inherit;color:inherit}
button,.btn{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--acc)}
.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
main{max-width:1100px;margin:0 auto;padding:16px 16px 60px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.stat b{display:block;font-size:22px}
.stat span{color:var(--mute);font-size:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
.filters>div:first-child{grid-column:span 2}
.filters label{font-size:12px;color:var(--mute);display:block}
.filters input[type=search],.filters select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.row2{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;align-items:center;font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.tab.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:6px 14px}
.item.top{border-left:4px solid var(--acc)}
.title{font-weight:600;color:var(--ink);text-decoration:none;word-break:break-word}
.title:hover{color:var(--acc);text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;color:var(--mute);font-size:12.5px;grid-column:1}
.badge{background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--ink)}
.b-Consultancy{background:#dbe8ff;color:#143a8a}.b-Grant{background:#e1f5e9;color:#0b5a38}.b-Job{background:#fdeccc;color:#7a4607}.b-Uncertain{background:var(--chip)}
@media (prefers-color-scheme:dark){.b-Consultancy{background:#1d2f57;color:#b8cdfd}.b-Grant{background:#16382a;color:#a6e6c5}.b-Job{background:#40300f;color:#f5d59b}}
.score{font-weight:700}
.dl-soon{color:var(--bad);font-weight:600}.dl-mid{color:var(--warn);font-weight:600}.dl-ok{color:var(--good)}
.acts{grid-column:2;grid-row:1/3;display:flex;gap:6px;align-items:flex-start}
.acts button{padding:4px 9px;font-size:13px}
.acts button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.health li{margin:3px 0}.health .bad{color:var(--bad)}
.hidden{display:none}
@media (max-width:640px){.item{grid-template-columns:1fr}.acts{grid-column:1;grid-row:auto}.filters{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <div><h1>Opportunity Scanner</h1><div class="sub" id="updated">Loading…</div></div>
  <div class="btns">
    <a class="btn primary" id="runlink" target="_blank" rel="noopener">Run scan now</a>
    <button id="healthbtn">Source health</button>
    <button id="exportbtn">Export CSV</button>
  </div>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div class="panel hidden health" id="health"></div>

  <div class="panel">
    <div class="filters">
      <div><label for="q">Search</label><input id="q" type="search" placeholder="title, source, location…"></div>
      <div><label for="cat">Category</label><select id="cat"></select></div>
      <div><label for="loc">Location</label><select id="loc"></select></div>
      <div><label for="src">Source</label><select id="src"></select></div>
      <div><label for="sort">Sort</label><select id="sort">
        <option value="score">Best match</option><option value="new">Newest</option><option value="deadline">Deadline soonest</option></select></div>
      <div><label for="min">Min score: <b id="minv">-9</b></label><input id="min" type="range" min="-5" max="12" value="-5"></div>
    </div>
    <div class="row2">
      <label><input type="checkbox" id="onlyDl"> Has deadline</label>
      <label><input type="checkbox" id="hideClosed" checked> Hide closed</label>
      <label><input type="checkbox" id="remoteOnly"> Remote / Kenya-Africa only</label>
      <button id="reset">Reset</button>
      <span class="sub" id="count"></span>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</main>

<script>
(function(){
"use strict";
const REPO = "michaelouru-sw/ngo-opportunity-scanner";
const TOP = 6;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : "#";
const today = new Date(); today.setHours(0,0,0,0);

// ---- storage (per browser) ----
const KEY = "ngoscan.status.v1";
let status = {};
try { status = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) { status = {}; }
const saveStatus = () => { try { localStorage.setItem(KEY, JSON.stringify(status)); } catch(e) {} };

// ---- CSV parsing (quoted fields, embedded commas/newlines) ----
function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c=='"') q=true;
    else if(c==','){row.push(f);f="";}
    else if(c=='\n'){row.push(f);rows.push(row);row=[];f="";}
    else if(c!='\r') f+=c;
  }
  if(f.length||row.length){row.push(f);rows.push(row);}
  const head=rows.shift()||[];
  return rows.filter(r=>r.length>1).map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]||""])));
}

let data=[], view="inbox";
const daysTo = d => d ? Math.round((new Date(d+"T00:00:00") - today)/864e5) : null;
const foundDate = s => new Date((s||"").replace(" UTC","Z").replace(" ","T"));

function prep(r){
  r.score = parseInt(r.score,10); if(isNaN(r.score)) r.score = 0;
  r.days = daysTo(r.deadline);
  r.when = foundDate(r.found_at);
  r.hay = [r.title,r.source,r.location,r.category,r.extra].join(" ").toLowerCase();
  return r;
}

function opts(sel, values, label){
  sel.innerHTML = `<option value="">${label}</option>` + values.map(v=>`<option>${esc(v)}</option>`).join("");
}

function init(rows){
  data = rows.map(prep);
  const uniq = k => [...new Set(data.map(r=>r[k]).filter(Boolean))].sort();
  opts($("cat"), ["Consultancy","Grant","Job","Uncertain"], "All");
  opts($("loc"), uniq("location"), "All");
  opts($("src"), uniq("source"), "All");
  const latest = data.reduce((m,r)=> r.when>m?r.when:m, new Date(0));
  $("updated").textContent = data.length + " opportunities logged · last found " + (latest.getTime()? latest.toLocaleString(): "n/a");
  render();
}

function matches(r){
  const st = status[r.url] || "";
  if(view==="inbox" && st) return false;
  if(view!=="inbox" && view!=="all" && st!==view) return false;
  const q=$("q").value.trim().toLowerCase();
  if(q && !q.split(/\s+/).every(w=>r.hay.includes(w))) return false;
  if($("cat").value && r.category!==$("cat").value) return false;
  if($("loc").value && r.location!==$("loc").value) return false;
  if($("src").value && r.source!==$("src").value) return false;
  if(r.score < +$("min").value) return false;
  if($("onlyDl").checked && r.days===null) return false;
  if($("hideClosed").checked && r.days!==null && r.days<0) return false;
  if($("remoteOnly").checked && !(r.location==="Remote"||r.location==="Kenya/Africa")) return false;
  return true;
}

function sortRows(rows){
  const s=$("sort").value;
  return rows.sort((a,b)=>{
    if(s==="new") return b.when-a.when;
    if(s==="deadline"){ const x=a.days===null?1e9:a.days, y=b.days===null?1e9:b.days; return x-y || b.score-a.score; }
    return b.score-a.score || b.when-a.when;
  });
}

function dlHtml(r){
  if(r.days===null) return '<span>deadline unknown</span>';
  if(r.days<0) return `<span class="dl-soon">closed ${-r.days}d ago</span>`;
  const cls = r.days<=3?"dl-soon":r.days<=10?"dl-mid":"dl-ok";
  return `<span class="${cls}">closes ${esc(r.deadline)} (${r.days===0?"today":r.days+"d"})</span>`;
}

function statsHtml(){
  const week = Date.now()-7*864e5;
  const open = data.filter(r=>!(r.days!==null&&r.days<0));
  const cards = [
    ["Open now", open.length, ()=>{$("hideClosed").checked=true;setView("all");}],
    ["New this week", data.filter(r=>r.when>week).length, ()=>{$("sort").value="new";setView("inbox");}],
    ["Top picks", open.filter(r=>r.score>=TOP).length, ()=>{$("min").value=TOP;setView("all");}],
    ["Closing ≤ 7 days", open.filter(r=>r.days!==null&&r.days<=7).length, ()=>{$("sort").value="deadline";$("onlyDl").checked=true;setView("all");}],
    ["Interested", Object.values(status).filter(v=>v==="interested").length, ()=>setView("interested")],
    ["Applied", Object.values(status).filter(v=>v==="applied").length, ()=>setView("applied")],
  ];
  const el=$("stats"); el.innerHTML="";
  cards.forEach(([label,n,fn])=>{
    const d=document.createElement("div"); d.className="stat";
    d.innerHTML=`<b>${n}</b><span>${esc(label)}</span>`; d.onclick=fn; el.appendChild(d);
  });
}

function tabsHtml(){
  const defs=[["inbox","Inbox"],["interested","Interested"],["applied","Applied"],["hidden","Hidden"],["all","All"]];
  $("tabs").innerHTML = defs.map(([k,l])=>`<span class="tab ${view===k?"on":""}" data-v="${k}">${l}</span>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(t=>t.onclick=()=>setView(t.dataset.v));
}

function setView(v){ view=v; render(); }

function render(){
  $("minv").textContent = $("min").value;
  statsHtml(); tabsHtml();
  const rows = sortRows(data.filter(matches));
  $("count").textContent = rows.length + " shown";
  const list=$("list");
  if(!rows.length){ list.innerHTML='<div class="empty">Nothing matches these filters.</div>'; return; }
  list.innerHTML = rows.slice(0,400).map((r,i)=>{
    const st = status[r.url]||"";
    return `<div class="item ${r.score>=TOP?"top":""}">
      <a class="title" href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a>
      <div class="acts" data-u="${esc(r.url)}">
        <button data-s="interested" class="${st==="interested"?"on":""}" title="Interested">★</button>
        <button data-s="applied" class="${st==="applied"?"on":""}" title="Applied">✓</button>
        <button data-s="hidden" class="${st==="hidden"?"on":""}" title="Hide">✕</button>
      </div>
      <div class="meta">
        <span class="badge b-${esc(r.category)}">${esc(r.category)}</span>
        <span class="score">${r.score}</span>
        <span>${esc(r.location)}</span> · ${dlHtml(r)} · <span>${esc(r.source)}</span>
        · <span>found ${isNaN(r.when)?"?":r.when.toLocaleDateString()}</span>
        ${r.extra?`· <span>${esc(r.extra)}</span>`:""}
      </div></div>`;
  }).join("") + (rows.length>400?`<div class="empty">Showing the first 400 — narrow the filters to see more.</div>`:"");
  list.querySelectorAll(".acts button").forEach(b=>b.onclick=()=>{
    const u=b.parentElement.dataset.u, s=b.dataset.s;
    if(status[u]===s) delete status[u]; else status[u]=s;
    saveStatus(); render();
  });
}

// ---- health panel ----
async function loadHealth(){
  const el=$("health");
  try{
    const r=await fetch("data/seen_opportunities.json",{cache:"no-cache"}); const j=await r.json();
    const h=j.health||{}, boards=Object.keys(j.boards||{});
    if(!Object.keys(h).length){ el.innerHTML='<b>Source health</b><div class="sub">No health data yet — it appears after the next scheduled run.</div>'; return; }
    const bad=Object.entries(h).filter(([n,v])=>v.zero_runs>0 && !n.startsWith("Board "));
    el.innerHTML = `<b>Source health</b> · ${Object.keys(h).length} sources tracked · ${boards.length} auto-discovered boards`
      + (bad.length ? `<ul>${bad.sort((a,b)=>b[1].zero_runs-a[1].zero_runs).map(([n,v])=>`<li class="bad">${esc(n)} — ${v.zero_runs} empty/failed run(s); last worked ${esc(v.last_ok||"never")}</li>`).join("")}</ul>`
                  : `<div class="sub">All sources returned results on the last run.</div>`);
  }catch(e){ el.innerHTML='<b>Source health</b><div class="sub">No health data yet — it appears after the first run with the new scanner.</div>'; }
}

// ---- export ----
function exportCSV(){
  const rows=sortRows(data.filter(matches));
  const cols=["score","category","location","deadline","source","title","url","found_at"];
  const cell=v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  // neutralise spreadsheet formula injection from scraped titles
  const safe=v=>/^[=+\-@]/.test(String(v))?"'"+v:v;
  const out=[cols.join(",")].concat(rows.map(r=>cols.map(c=>cell(safe(r[c]))).join(","))).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([out],{type:"text/csv"})); a.download="opportunities_filtered.csv"; a.click();
}

// ---- wiring ----
["q","cat","loc","src","sort","min","onlyDl","hideClosed","remoteOnly"].forEach(id=>$(id).addEventListener("input",render));
$("reset").onclick=()=>{["q","cat","loc","src"].forEach(i=>$(i).value="");$("sort").value="score";$("min").value=-5;
  $("onlyDl").checked=false;$("hideClosed").checked=true;$("remoteOnly").checked=false;view="inbox";render();};
$("healthbtn").onclick=()=>{$("health").classList.toggle("hidden");};
$("exportbtn").onclick=exportCSV;
$("runlink").href="https://github.com/"+REPO+"/actions/workflows/daily-scan.yml";

fetch("data/opportunities_log.csv",{cache:"no-cache"})
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); })
  .then(t=>init(parseCSV(t)))
  .catch(e=>{ $("updated").textContent="Could not load data/opportunities_log.csv ("+e.message+")"; });
loadHealth();
})();
</script>
</body>
</html>
